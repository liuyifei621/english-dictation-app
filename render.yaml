services:
  - type: web
    name: english-dictation-extractor
    runtime: docker
    rootDir: server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8787
  - type: web
    name: english-dictation-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm exec expo export --platform web
    staticPublishPath: ./dist
